name: Cloud Currency Scraper

on:
  schedule:
    # يعمل كل ساعتين (من 6 صباحاً حتى 6 مساءً UTC) من الأحد إلى السبت فقط (يتوقف الجمعة والسبت)
   - cron: '0 5,8,11,15 * * 0-4,6'
    #  timezone: "Asia/Damascus"
    # cron: '0 6-18/3 * * 0-4,6'
  workflow_dispatch: # يسمح بالتشغيل اليدوي في أي وقت (حتى يومي الجمعة والسبت )
  

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 supabase

      - name: Run scraper script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scraper.py
